<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Movie Cruiser</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/style.css" />
</head>

<body onload="getMovies(); getFavourites();">

    <div class="container mt-4">

        <h1 class="text-center mb-4">Movie Cruiser</h1>

        <div class="row">

            <!-- Movies Section -->
            <div class="col-md-6">
                <h2 class="text-center">Movies</h2>

                <ul id="moviesList" class="list-group">
                </ul>
            </div>

            <!-- Favourites Section -->
            <div class="col-md-6">
                <h2 class="text-center">Favourites</h2>

                <ul id="favouritesList" class="list-group">
                </ul>
            </div>

        </div>

    </div>

    <script src="js/script.js"></script>

</body>
</html>
